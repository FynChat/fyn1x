[project]
name = "fyn1x"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Григорий", email = "xoppee.ru@yandex.com" }
]
requires-python = ">=3.12"
dependencies = [
    "duckduckgo-search>=8.1.1",
    "openai>=3.14.1",
    "prompt-toolkit>=3.0.53",
    "pydantic-ai>=2.43.0",
    "pyfiglet>=1.0.4",
    "questionary>=2.1.1",
    "rich>=15.0.0",
    "smolagents>=1.26.0",
]

[project.scripts]
